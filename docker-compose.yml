services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: learnloop
      POSTGRES_USER: learnloop
      POSTGRES_PASSWORD: learnloop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnloop -d learnloop"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DB_URL: jdbc:postgresql://db:5432/learnloop
      DB_USER: learnloop
      DB_PASSWORD: learnloop
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
